    <main class="form-page">
        <h2>AVALIE A TEMPORADA</h2>
        <p class="form-subtitle">Envie seu relatório de missão para a comunidade.</p>

        <!-- Adicionado ID form-review -->
        <form id="form-review" class="review-form">
            <div class="form-group">
                <label for="nome">Nome do Soldado:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Levi Ackerman" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" placeholder="soldado@paradis.com" required>
            </div>

            <div class="form-group">
                <label for="cargo">Cargo do Usuário:</label>
                <select id="cargo" name="cargo" required>
                    <option value="" disabled selected>Escolha uma opção...</option>
                    <option value="Eldiano">Eldiano</option>
                    <option value="Marleyano">Marleyano</option>
                    <option value="Soldado Eldiano">Soldado Eldiano</option>
                    <option value="Soldado Marleyano">Soldado Marleyano</option>
                    <option value="Capitão da Guarnição">Capitão da Guarnição</option>
                </select>
            </div>

            <div class="form-group">
                <label for="temporada">Selecione o Arco / Temporada:</label>
                <select id="temporada" name="temporada" required>
                    <option value="" disabled selected>Escolha uma opção...</option>
                    <option value="1ª Temporada">1ª Temporada</option>
                    <option value="2ª Temporada">2ª Temporada</option>
                    <option value="3ª Temporada (P2)">3ª Temporada (P2)</option>
                    <option value="The Final Season">The Final Season</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nota da Avaliação:</label>
                <div class="radio-group">
                    <label><input type="radio" name="nota" value="1" required> 1 ★</label>
                    <label><input type="radio" name="nota" value="2"> 2 ★</label>
                    <label><input type="radio" name="nota" value="3"> 3 ★</label>
                    <label><input type="radio" name="nota" value="4"> 4 ★</label>
                    <label><input type="radio" name="nota" value="5"> 5 ★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="review">Comentários / Review:</label>
                <textarea id="review" name="review" rows="4" placeholder="O que achou da animação e dos acontecimentos?"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">ENVIAR REVIEW</button>
                <button type="reset" class="btn-reset">LIMPAR</button>
            </div>
        </form>

        <!-- Seção onde as avaliações salvas serão exibidas -->
        <section style="margin-top: 40px;">
            <h3 style="color: #fff; text-align: center; margin-bottom: 20px;">📜 RELATÓRIOS ENVIADOS</h3>
            <div id="mural-reviews"></div>
        </section>
    </main>
